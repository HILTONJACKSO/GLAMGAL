version: '3.8'

services:
  glamgal-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glamgal_storefront
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    networks:
      - glamgal-network

networks:
  glamgal-network:
    driver: bridge
